# Claude Code on GitHub: mention @claude in an issue or PR comment and Claude works on it
# (answers, or opens a pull request with a fix). Only users with WRITE access to this repo can
# trigger it - comments from anyone else are ignored by the action - and nothing is merged automatically.
# Setup: install https://github.com/apps/claude on this repo and add the secret CLAUDE_CODE_OAUTH_TOKEN
# (create it with `claude setup-token`). See CLAUDE.md for the project rules Claude follows.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 60"
