# Builds CoreHUD on a GitHub-hosted Windows runner, gets CoreHUD.exe code-signed by SignPath (free code signing for
# open source, certificate by SignPath Foundation) and publishes the GitHub release with the signed exe.
#
# Start it by pushing a version tag that matches src/version.h:   git tag v1.6.0 && git push origin v1.6.0
# (or run it by hand: Actions > Release > Run workflow, with the tag).
#
# Every release needs a manual approval in SignPath before it is signed; the workflow waits up to an hour for it.
# Nothing is published unsigned: if signing isn't set up, fails or isn't approved, the workflow stops.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   secret    SIGNPATH_API_TOKEN          API token of a SignPath user with "submitter" rights on the project
#   variable  SIGNPATH_ORGANIZATION_ID    SignPath organization id
#   variable  SIGNPATH_PROJECT_SLUG       e.g. CoreHUD
#   variable  SIGNPATH_POLICY_SLUG        e.g. release-signing
#   variable  SIGNPATH_ARTIFACT_CONFIG    optional: artifact configuration slug (default configuration if empty)
name: Release (build, sign, publish)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (vX.Y.Z, must match src/version.h)'
        required: true

permissions:
  contents: write   # create the release
  actions: read     # SignPath reads the uploaded artifact

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest   # GitHub-hosted only (SignPath requirement for open-source signing)
    timeout-minutes: 120
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Check that signing is set up
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_POLICY_SLUG }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN -or -not $env:ORG -or -not $env:PROJECT -or -not $env:POLICY) {
            Write-Output "::error::SignPath is not configured (secret SIGNPATH_API_TOKEN, variables SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG). Nothing was published."
            exit 1
          }

      - name: Check that the tag matches src/version.h
        shell: pwsh
        run: |
          $m = Select-String -Path src/version.h -Pattern '#define COREHUD_VERSION_STR "([0-9]+\.[0-9]+\.[0-9]+)"'
          if (-not $m) { Write-Output "::error::COREHUD_VERSION_STR not found in src/version.h"; exit 1 }
          $v = $m.Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { Write-Output "::error::Tag $env:TAG does not match src/version.h ($v)"; exit 1 }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: cmd
        run: build.bat

      - name: Unit tests
        shell: cmd
        run: tests\run_tests.bat

      - name: Upload the unsigned exe for SignPath
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: CoreHUD-${{ env.VERSION }}-unsigned
          path: bin/CoreHUD.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign with SignPath (waits for the manual approval)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Verify the signature and the version
        shell: pwsh
        run: |
          $exe = "signed/CoreHUD.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error::signed/CoreHUD.exe missing"; exit 1 }
          $sig = Get-AuthenticodeSignature $exe
          Write-Output "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Output "::error::Signature is not valid ($($sig.Status))"; exit 1 }
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne 'CoreHUD' -or $info.ProductVersion -ne $env:VERSION) {
            Write-Output "::error::Unexpected exe metadata: $($info.ProductName) $($info.ProductVersion)"; exit 1
          }

      - name: Checksums and release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash signed/CoreHUD.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CoreHUD.exe" | Out-File -FilePath signed/SHA256SUMS.txt -Encoding ascii -NoNewline
          # notes = this version's section of the README changelog
          $lines = Get-Content README.md -Encoding utf8
          $start = [Array]::IndexOf($lines, "**$env:VERSION**")
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^\*\*\d+\.\d+\.\d+\*\*' -and $lines[$i] -notmatch '^## '; $i++) { $notes += $lines[$i] }
          }
          $notes += ''
          $notes += '**Download:** `CoreHUD.exe` (one file, no install). Put it in its own folder and run it.'
          $notes += ''
          $notes += "SHA-256: ``$hash``"
          $notes += ''
          $notes += 'Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). [Code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md)'
          $notes -join "`n" | Out-File -FilePath notes.md -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG signed/CoreHUD.exe signed/SHA256SUMS.txt --repo ${{ github.repository }} --verify-tag `
            --title "CoreHUD $env:VERSION" --notes-file notes.md --latest
